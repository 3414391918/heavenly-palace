<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">虚拟世界主智能体运行流程图</title>
  <desc id="desc">用户提出任务后，主智能体读取相关作品内容，按需加载技能、素材或调用子智能体，汇总结果。只需回答时直接回复；需要改动时生成提案，确认后写入本地书库。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#85aaf5"/></marker>
    <style>
      .bg{fill:#11151b}.card{fill:#22272f;stroke:#49515c;stroke-width:2}.accent{fill:#243346;stroke:#5b8ff0;stroke-width:2}.finish{fill:#1c342c;stroke:#4fb38a;stroke-width:2}.muted{fill:#aeb6c2}.bright{fill:#f5f7fa}.line{fill:none;stroke:#85aaf5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#85aaf5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#667384;stroke-width:2;stroke-dasharray:8 9}.badge{fill:#5b8ff0}.title{font:700 48px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{font:700 31px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.body{font:23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.small{font:21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.num{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="940"/>
  <text x="80" y="90" class="title bright">主智能体怎样完成一次创作任务</text>
  <text x="82" y="130" class="body muted">只看主线：读作品 → 借助工具 → 给出结果 → 必要时保存</text>

  <rect x="80" y="204" width="300" height="184" rx="22" class="card"/>
  <circle cx="125" cy="249" r="23" class="badge"/><text x="125" y="256" text-anchor="middle" class="num bright">1</text>
  <text x="112" y="310" class="head bright">你提出任务</text>
  <text x="112" y="351" class="body muted">例如：写一章、改设定</text>

  <rect x="460" y="204" width="300" height="184" rx="22" class="accent"/>
  <circle cx="505" cy="249" r="23" class="badge"/><text x="505" y="256" text-anchor="middle" class="num bright">2</text>
  <text x="492" y="310" class="head bright">读取相关内容</text>
  <text x="492" y="351" class="body muted">设定、剧情、正文、账本</text>

  <rect x="840" y="204" width="300" height="184" rx="22" class="card"/>
  <circle cx="885" cy="249" r="23" class="badge"/><text x="885" y="256" text-anchor="middle" class="num bright">3</text>
  <text x="872" y="310" class="head bright">按需调用帮助</text>
  <text x="872" y="351" class="body muted">技能、素材、子智能体</text>

  <rect x="1220" y="204" width="300" height="184" rx="22" class="accent"/>
  <circle cx="1265" cy="249" r="23" class="badge"/><text x="1265" y="256" text-anchor="middle" class="num bright">4</text>
  <text x="1252" y="310" class="head bright">汇总本轮结果</text>
  <text x="1252" y="351" class="body muted">形成答复或修改内容</text>

  <path d="M380 296 H444" class="line"/><path d="M450 296 L436 287 L436 305 Z" fill="#85aaf5"/>
  <path d="M760 296 H824" class="line"/><path d="M830 296 L816 287 L816 305 Z" fill="#85aaf5"/>
  <path d="M1140 296 H1204" class="line"/><path d="M1210 296 L1196 287 L1196 305 Z" fill="#85aaf5"/>

  <path d="M1370 388 V470 H800 V522" class="line"/><path d="M800 528 L790 512 L810 512 Z" fill="#85aaf5"/>
  <rect x="648" y="523" width="304" height="65" rx="32" class="card"/>
  <text x="800" y="566" text-anchor="middle" class="body bright">需要修改作品吗？</text>

  <path d="M800 588 V629 H373 V653" class="branch"/>
  <path d="M373 629 V653" class="line"/><path d="M373 659 L363 643 L383 643 Z" fill="#85aaf5"/>
  <path d="M800 588 V629 H1202 V653" class="branch"/>
  <path d="M1202 629 V653" class="line"/><path d="M1202 659 L1192 643 L1212 643 Z" fill="#85aaf5"/>
  <text x="530" y="617" class="small muted">不用修改</text>
  <text x="1025" y="617" class="small muted">需要修改</text>

  <rect x="160" y="670" width="426" height="143" rx="22" class="finish"/>
  <text x="195" y="726" class="head bright">直接回复你</text>
  <text x="195" y="769" class="body muted">作品文件没有变化</text>

  <rect x="967" y="670" width="469" height="143" rx="22" class="accent"/>
  <text x="1002" y="726" class="head bright">提交修改提案</text>
  <text x="1002" y="769" class="body muted">确认后写入本地书库</text>

  <text x="80" y="865" class="small muted">确认保存后，下一次任务会读取本地书库中的最新内容。</text>
  <text x="80" y="903" class="small muted">技能提供写作方法，素材提供参考；子智能体只在已配置时协助。</text>
</svg>
