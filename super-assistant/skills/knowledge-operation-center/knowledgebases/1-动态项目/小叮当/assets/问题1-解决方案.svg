<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="890" viewBox="0 0 1100 890"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="1100" height="890" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#172033"><text x="550" y="38" text-anchor="middle" font-size="27">任务中断：仅针对指定错误自动重试</text><rect x="72" y="65" width="156" height="48" rx="7" fill="#eef2ff" stroke="#64748b"/><text x="150" y="97" text-anchor="middle" font-size="21">界面</text><line x1="150" x2="150" y1="113" y2="812" stroke="#94a3b8" stroke-dasharray="6 6"/><rect x="442" y="65" width="156" height="48" rx="7" fill="#eef2ff" stroke="#64748b"/><text x="520" y="97" text-anchor="middle" font-size="21">Agent</text><line x1="520" x2="520" y1="113" y2="812" stroke="#94a3b8" stroke-dasharray="6 6"/><rect x="852" y="65" width="156" height="48" rx="7" fill="#eef2ff" stroke="#64748b"/><text x="930" y="97" text-anchor="middle" font-size="21">模型调用</text><line x1="930" x2="930" y1="113" y2="812" stroke="#94a3b8" stroke-dasharray="6 6"/><line x1="520" x2="930" y1="162" y2="162" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="725.0" y="150" text-anchor="middle" font-size="21">请求执行下一步</text><line x1="930" x2="520" y1="214" y2="214" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="725.0" y="202" text-anchor="middle" font-size="21">返回错误</text><rect x="55" y="245" width="990" height="410" fill="none" stroke="#64748b" stroke-width="2"/><text x="550" y="280" text-anchor="middle" font-size="21">以下任一错误，自动重试</text><text x="550" y="310" text-anchor="middle" font-size="21">api_error：stream was reset: INTERNAL_ERROR</text><text x="550" y="340" text-anchor="middle" font-size="21">MODEL_RESPONSE_INCOMPLETE</text><line x1="520" x2="930" y1="390" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="725.0" y="378" text-anchor="middle" font-size="21">自动重试，最多 2 次</text><text x="280" y="415" text-anchor="middle" font-size="19">重试成功</text><line x1="930" x2="520" y1="454" y2="454" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="725.0" y="442" text-anchor="middle" font-size="21">返回结果</text><line x1="520" x2="150" y1="506" y2="506" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="335.0" y="494" text-anchor="middle" font-size="21">继续执行任务</text><line x1="55" x2="1045" y1="539" y2="539" stroke="#64748b" stroke-dasharray="7 5"/><text x="280" y="573" text-anchor="middle" font-size="19">重试仍失败</text><line x1="520" x2="150" y1="621" y2="621" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="335.0" y="609" text-anchor="middle" font-size="21">显示“执行失败”</text><rect x="55" y="680" width="990" height="115" fill="none" stroke="#64748b" stroke-width="2"/><text x="750" y="713" text-anchor="middle" font-size="19">其他错误：不触发本次新增重试</text><line x1="520" x2="150" y1="759" y2="759" stroke="#334155" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="335.0" y="747" text-anchor="middle" font-size="21">按原有错误处理</text><text x="550" y="853" text-anchor="middle" font-size="20">用户主动停止时不重试；失败消息不再误显示“已完成”。</text></g></svg>